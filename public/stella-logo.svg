<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Stella Logo</title>
  <desc id="logoDesc">A radiant star with orbital rings on a night-sky sphere.</desc>
  <defs>
    <radialGradient id="stellaBg" cx="50%" cy="35%" r="68%">
      <stop offset="0%" stop-color="#173764" />
      <stop offset="62%" stop-color="#0a1b35" />
      <stop offset="100%" stop-color="#040914" />
    </radialGradient>
    <linearGradient id="stellaRing" x1="18%" y1="26%" x2="86%" y2="78%">
      <stop offset="0%" stop-color="#9fe4ff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#5cb8ff" stop-opacity="0.62" />
    </linearGradient>
    <linearGradient id="stellaStar" x1="50%" y1="16%" x2="50%" y2="88%">
      <stop offset="0%" stop-color="#fbfdff" />
      <stop offset="50%" stop-color="#d3efff" />
      <stop offset="100%" stop-color="#87d7ff" />
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="116" fill="url(#stellaBg)" />
  <circle cx="128" cy="128" r="115" fill="none" stroke="#9aceff" stroke-opacity="0.34" stroke-width="2" />

  <circle
    cx="128"
    cy="128"
    r="84"
    fill="none"
    stroke="#9cdcff"
    stroke-opacity="0.26"
    stroke-width="3"
    stroke-dasharray="4 12"
  />
  <ellipse
    cx="128"
    cy="128"
    rx="95"
    ry="44"
    transform="rotate(-20 128 128)"
    fill="none"
    stroke="url(#stellaRing)"
    stroke-width="6"
  />
  <ellipse
    cx="128"
    cy="128"
    rx="95"
    ry="44"
    transform="rotate(30 128 128)"
    fill="none"
    stroke="#b5ecff"
    stroke-opacity="0.48"
    stroke-width="3"
  />

  <path
    d="M128 64L139 106L183 128L139 150L128 192L117 150L73 128L117 106Z"
    fill="url(#stellaStar)"
    stroke="#f8fdff"
    stroke-opacity="0.9"
    stroke-width="2"
  />
  <circle cx="182" cy="73" r="5" fill="#d8f6ff" />
  <circle cx="72" cy="179" r="4" fill="#bbe9ff" />
</svg>
